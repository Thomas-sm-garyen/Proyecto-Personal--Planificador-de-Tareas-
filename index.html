<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Tareas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Para Agregar iconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <div class="container py-4">

    <!-- HEADER -->
    <header class="card shadow-sm mb-4">
      <div class="card-body text-center py-4 bg-purple-custom text-white rounded">
        <h1 class="h3 m-0">
          <i class="bi bi-calendar-check me-2"></i>Planificador de Tareas
        </h1>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL EN DOS COLUMNAS -->
    <div class="row g-4">

      <!-- FORMULARIO -->
      <section class="col-12 col-md-5 col-lg-4">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-white">
            <h2 class="h5 card-title m-0">Formulario</h2>
          </div>
          <div class="card-body">
            <form id="taskForm">
              <div class="mb-3">
                <label for="taskTitle" class="form-label">Tarea</label>
                <input type="text" class="form-control" id="taskTitle" placeholder="Ej. Practicar Ingles" required>
              </div>

              <div class="mb-3">
                <label for="taskDescription" class="form-label">Descripción</label>
                <textarea class="form-control" id="taskDescription" rows="3" placeholder="Detalles..."></textarea>
              </div>

              <div class="mb-3">
                <label for="taskCategory" class="form-label">Categoría</label>
                <select class="form-select" id="taskCategory">
                  <option selected value="personal">Personal</option>
                  <option value="trabajo">Trabajo</option>
                  <option value="estudios">Estudios</option>
                </select>
              </div>

              <button type="submit" class="bg-green-custom w-100 mt-2">
                <i class="bi bi-plus-lg me-1"></i> Agregar tarea
              </button>
            </form>
          </div>
        </div>
      </section>

      <!-- LISTA DE TAREAS -->
      <section class="col-12 col-md-7 col-lg-8">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h2 class="h5 card-title m-0">Tus Tareas</h2>
            <span class="badge bg-secondary">5 pendientes</span>
          </div>
          <div class="card-body">
            <ul class="list-group list-group-flush">

              <!-- task1 -->
              <li class="list-group-item d-flex align-items-center justify-content-between py-3">
                <div class="form-check d-flex align-items-center gap-2">
                  <input class="form-check-input mt-0" type="checkbox" id="task1">
                  <label class="form-check-label mb-0" for="task1">
                    <strong>Completar WireFrame en Figma</strong>
                    <div class="text-muted small">Responsive y mejorar diseño</div>
                  </label>
                </div>
                <button class="btn btn-outline-danger btn-sm border-0" title="Eliminar">
                  <i class="bi bi-trash"></i>
                </button>
              </li>

              <!-- task 2 -->
              <li class="list-group-item d-flex align-items-center justify-content-between py-3">
                <div class="form-check d-flex align-items-center gap-2">
                  <input class="form-check-input mt-0" type="checkbox" id="task2">
                  <label class="form-check-label mb-0" for="task2">
                    <strong>Entender como funciona Intellij</strong>
                    <div class="text-muted small">Aprender como haceer commits desde el entorno de desarrollo</div>
                  </label>
                </div>
                <button class="btn btn-outline-danger btn-sm border-0" title="Eliminar">
                  <i class="bi bi-trash"></i>
                </button>
              </li>

              <!-- task 3 -->
              <li class="list-group-item d-flex align-items-center justify-content-between py-3">
                <div class="form-check d-flex align-items-center gap-2">
                  <input class="form-check-input mt-0" type="checkbox" id="task3" >
                  <label class="form-check-label mb-0" for="task3">
                    <strong>Practicar sintaxis en Java</strong>
                    <div class="text-muted small">Entender la forma en la que Java funciona, mas que todo la sintaxis</div>
                  </label>
                </div>
                <button class="btn btn-outline-danger btn-sm border-0" title="Eliminar">
                  <i class="bi bi-trash"></i>
                </button>
              </li>

              <!-- task 4 -->
              <li class="list-group-item d-flex align-items-center justify-content-between py-3">
                <div class="form-check d-flex align-items-center gap-2">
                  <input class="form-check-input mt-0" type="checkbox" id="task4" >
                  <label class="form-check-label mb-0" for="task4">
                    <strong>Trabajar en el proyecto personal</strong>
                    <div class="text-muted small">Ir poco a poco desarrollando el proyecto personal para añadir al portafolio</div>
                  </label>
                </div>
                <button class="btn btn-outline-danger btn-sm border-0" title="Eliminar">
                  <i class="bi bi-trash"></i>
                </button>
              </li>

              <!-- task 5-->
              <li class="list-group-item d-flex align-items-center justify-content-between py-3">
                <div class="form-check d-flex align-items-center gap-2">
                  <input class="form-check-input mt-0" type="checkbox" id="task5" >
                  <label class="form-check-label mb-0" for="task5">
                    <strong>Mejorar el Figma del portafolio</strong>
                    <div class="text-muted small">Optimazar detalles del portafolio en el figma para desarrollarlo en codigo</div>
                  </label>
                </div>
                <button class="btn btn-outline-danger btn-sm border-0" title="Eliminar">
                  <i class="bi bi-trash"></i>
                </button>
              </li>

              

            </ul>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- JS Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
